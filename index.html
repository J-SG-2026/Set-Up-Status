<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Set Up Status</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 10px; padding: 0; background-color: #f9f9f9; }
        h2 { margin: 5px 0 15px 0; color: #333; font-size: 22px; }
        .user-panel { margin-bottom: 15px; padding: 8px 12px; background: #fff; border: 1px solid #ccc; border-radius: 6px; display: flex; align-items: center; gap: 10px; max-width: 100%; }
        .user-panel label { font-size: 16px; white-space: nowrap; }
        .user-panel input { padding: 8px; font-size: 16px; flex-grow: 1; min-width: 0; }
        .btn-update { padding: 8px 14px; font-size: 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap; }
        .btn-update:hover { background-color: #0056b3; }
        table { border-collapse: collapse; width: 100%; background-color: #fff; table-layout: fixed; }
        th, td { border: 1px solid #000; padding: 6px; text-align: left; font-size: 15px; word-wrap: break-word; }
        th { background-color: #f2f2f2; font-size: 14px; }
        th:nth-child(1), td:nth-child(1) { width: 38%; }
        th:nth-child(2), td:nth-child(2) { width: 14%; text-align: center; }
        th:nth-child(3), td:nth-child(3) { width: 10%; text-align: center; }
        th:nth-child(4), td:nth-child(4) { width: 10%; text-align: center; font-weight: bold; }
        th:nth-child(5), td:nth-child(5) { width: 28%; }
        
        /* Table Stage Colors */
        .stage-1 { background-color: #C8E6C9; color: #1B5E20; }
        .stage-2 { background-color: #81C784; color: #0D3B0E; }
        .stage-3 { background-color: #4CAF50; color: #ffffff; }
        .stage-4 { background-color: #2E7D32; color: #ffffff; }
        
        .status-cell { cursor: pointer; vertical-align: middle; transition: background-color 0.2s ease; font-size: 13px; }
        .status-cell:hover { background-color: #f0f0f0; }
        .status-cell.has-status { color: #ffffff; font-weight: bold; }
        .status-title { font-size: 13px; display: block; line-height: 1.2; }
        .status-meta { font-size: 10px; font-weight: normal; display: block; margin-top: 3px; opacity: 0.95; }
        
        /* Enlarged Mobile Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; padding: 25px 20px; border-radius: 12px; width: 92%; max-width: 450px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); text-align: center; }
        .modal h3 { margin-top: 0; margin-bottom: 20px; font-size: 22px; color: #222; font-weight: bold; }
        .modal-options { display: flex; flex-direction: column; gap: 14px; }
        
        /* Modal Action Buttons */
        .modal-btn { padding: 18px 12px; font-size: 18px; font-weight: bold; background-color: #2E7D32; color: #ffffff; border: none; border-radius: 8px; cursor: pointer; transition: background-color 0.15s ease, transform 0.05s ease; }
        .modal-btn:active { transform: scale(0.98); }
        .modal-btn:hover { background-color: #1B5E20; }
        
        /* Red Clear Button */
        .modal-btn.clear-btn { background-color: #dc3545; color: #ffffff; border: none; margin-top: 6px; }
        .modal-btn.clear-btn:hover { background-color: #bd2130; }
        
        /* Grey Cancel Button */
        .modal-btn.cancel-btn { background-color: #6c757d; color: #ffffff; border: none; }
        .modal-btn.cancel-btn:hover { background-color: #5a6268; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <h2>Set Up Status</h2>

    <div class="user-panel">
        <label for="username"><strong>Staff Name:</strong></label>
        <input type="text" id="username" value="Y" placeholder="Enter Name">
        <button class="btn-update" id="btnUpdateName">Update</button>
    </div>

    <table id="trackerTable">
        <thead>
            <tr>
                <th>Venues</th>
                <th>Cat</th>
                <th>Note</th>
                <th>Stage</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div class="modal-overlay" id="optionModal">
        <div class="modal">
            <h3 id="modalVenueTitle">Select Status</h3>
            <div class="modal-options">
                <button class="modal-btn" data-action="set" data-value="Eq at Venue" data-stage="1">1. Eq at Venue</button>
                <button class="modal-btn" data-action="set" data-value="Eq set up" data-stage="2">2. Eq set up</button>
                <button class="modal-btn" data-action="set" data-value="Eq Checked" data-stage="3">3. Eq Checked</button>
                <button class="modal-btn" data-action="set" data-value="Eq Kept" data-stage="4">4. Eq Kept</button>
                <button class="modal-btn clear-btn" data-action="clear">Clear Status / Reset</button>
                <button class="modal-btn cancel-btn" data-action="cancel">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // CONFIGURATIONS
        // -------------------------------------------------------------
        // TODO: PASTE YOUR GOOGLE APP SCRIPT WEB APP URL HERE!
        const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbx0ZXh-z-gO2Me5GTPjSLaC1nix6o68r_4ojsLQQ5mh9vECLY9_AQzApWqnnmqMVTPQ/exec";

        // TODO: PASTE YOUR FIREBASE CONFIGURATION HERE!
        const firebaseConfig = {
            apiKey: "AIzaSyCvwQzmM5mYxj1NGEBcx4CwX2V94QfYBOw",
            authDomain: "set-up-status.firebaseapp.com",
            databaseURL: "https://set-up-status-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "set-up-status",
            storageBucket: "set-up-status.firebasestorage.app",
            messagingSenderId: "209978478786",
            appId: "1:209978478786:web:c202c1176964ab803d6b5b"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const statusRef = database.ref('setup_status');

        let currentStaffName = document.getElementById("username").value.trim() || "Y";
        let activeVenueId = null;

        const tableData = [
            { id: "v1", venue: "Van Gogh #01-11", category: "Prep", note: "CL" },
            { id: "v2", venue: "2I #02-03", category: "Prep", note: "ML" },
            { id: "v3", venue: "6M #04-05", category: "Prep", note: "CL" },
            { id: "v4", venue: "2R #02-04", category: "Prep", note: "ML" },
            { id: "v5", venue: "1C #01-22", category: "Prep", note: "CL" },
            { id: "v6", venue: "5M #04-01", category: "Prep", note: "CL" },
            { id: "v7", venue: "2S #02-27", category: "Prep", note: "TL" },
            { id: "v8", venue: "Meeting Room 1", category: "Exam", note: "CL" },
            { id: "v9", venue: "Meeting Room 2", category: "Exam", note: "CL" },
            { id: "v10", venue: "Meeting Room 3", category: "Exam", note: "CL" },
            { id: "v11", venue: "6R classroom 01-29", category: "Exam", note: "CL" },
            { id: "v12", venue: "1R classroom 01-20", category: "Exam", note: "CL" },
            { id: "v13", venue: "1I classroom 01-21", category: "Exam", note: "CL" },
            { id: "v14", venue: "Einstein 02-15", category: "Exam", note: "ML" },
            { id: "v15", venue: "Newton 02-14", category: "Exam", note: "ML" },
            { id: "v16", venue: "4 M classroom 02-13", category: "Exam", note: "ML" },
            { id: "v17", venue: "Library Stage", category: "Exam", note: "ML" },
            { id: "v18", venue: "Library Corner A", category: "Exam", note: "ML" },
            { id: "v19", venue: "Library Corner B", category: "Exam", note: "ML" },
            { id: "v20", venue: "Library small room", category: "Exam", note: "ML" },
            { id: "v21", venue: "3T classroom 02-21", category: "Exam", note: "TL" },
            { id: "v22", venue: "6M2 classroom", category: "Exam", note: "CL" },
            { id: "v23", venue: "Music Room 1", category: "Exam", note: "CL" }
        ];

        const optionToStage = { "Eq at Venue": 1, "Eq set up": 2, "Eq Checked": 3, "Eq Kept": 4 };
        const tbody = document.querySelector("#trackerTable tbody");
        const modal = document.getElementById("optionModal");
        const modalTitle = document.getElementById("modalVenueTitle");

        function getFormattedDate() {
            return new Date().toLocaleDateString('en-GB', { timeZone: 'Asia/Singapore' });
        }

        function getFormattedTime() {
            return new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Singapore' });
        }

        function logToGoogleSheet(venueObj, statusText, stageNum) {
            if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL.includes("PASTE_YOUR_GOOGLE")) return;

            const payload = {
                date: getFormattedDate(),
                time: getFormattedTime(),
                venue: venueObj.venue || "",
                category: venueObj.category || "",
                note: venueObj.note || "",
                stage: stageNum || "",
                status: statusText || "",
                staff: currentStaffName || ""
            };

            fetch(GOOGLE_SHEET_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => console.warn("Google Sheet logging failed:", err));
        }

        tableData.forEach((row) => {
            const tr = document.createElement("tr");
            tr.setAttribute("id", `row-${row.id}`);

            tr.innerHTML = `
                <td>${row.venue}</td>
                <td>${row.category}</td>
                <td>${row.note}</td>
                <td class="stage-cell" id="stage-${row.id}"></td>
                <td class="status-cell" id="status-${row.id}"></td>
            `;

            const statusCell = tr.querySelector(".status-cell");
            const stageCell = tr.querySelector(".stage-cell");
            
            const openModal = () => {
                activeVenueId = row.id;
                modalTitle.textContent = `${row.venue}`;
                modal.classList.add("active");
            };

            statusCell.addEventListener("click", openModal);
            stageCell.addEventListener("click", openModal);
            tbody.appendChild(tr);
        });

        modal.querySelectorAll(".modal-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const action = btn.getAttribute("data-action");
                modal.classList.remove("active");

                if (!activeVenueId) return;
                const venueObj = tableData.find(v => v.id === activeVenueId);
                if (!venueObj) return;

                if (action === "set") {
                    const opt = btn.getAttribute("data-value");
                    const stage = btn.getAttribute("data-stage");

                    statusRef.child(activeVenueId).set({
                        selectedOption: opt,
                        stage: stage,
                        updatedBy: currentStaffName,
                        timestamp: getFormattedTime()
                    });

                    logToGoogleSheet(venueObj, opt, stage);

                } else if (action === "clear") {
                    statusRef.child(activeVenueId).remove();
                    logToGoogleSheet(venueObj, "RESET / CLEARED", "-");
                }

                activeVenueId = null;
            });
        });

        modal.addEventListener("click", (e) => {
            if (e.target === modal) {
                modal.classList.remove("active");
                activeVenueId = null;
            }
        });

        document.getElementById("btnUpdateName").addEventListener("click", () => {
            const newName = document.getElementById("username").value.trim();
            if (!newName) return alert("Please enter a valid staff name.");

            const oldName = currentStaffName;
            currentStaffName = newName;

            if (oldName && oldName !== newName) {
                statusRef.once('value', (snapshot) => {
                    const updates = {};
                    const data = snapshot.val() || {};
                    Object.keys(data).forEach(vId => {
                        if (data[vId] && data[vId].updatedBy === oldName) {
                            updates[`${vId}/updatedBy`] = newName;
                        }
                    });
                    if (Object.keys(updates).length > 0) statusRef.update(updates);
                });
            }
            alert(`Staff name updated to: ${newName}`);
        });

        statusRef.on('value', (snapshot) => {
            const data = snapshot.val() || {};
            tableData.forEach((row) => {
                const statusCell = document.getElementById(`status-${row.id}`);
                const stageCell = document.getElementById(`stage-${row.id}`);
                const rowState = data[row.id];

                stageCell.className = "stage-cell";
                statusCell.className = "status-cell";

                if (rowState && rowState.selectedOption) {
                    const stageNum = rowState.stage || optionToStage[rowState.selectedOption] || "";
                    stageCell.textContent = stageNum;
                    if (stageNum) stageCell.classList.add(`stage-${stageNum}`);

                    statusCell.classList.add("has-status");
                    if (stageNum) statusCell.classList.add(`stage-${stageNum}`);

                    statusCell.innerHTML = `
                        <span class="status-title">${rowState.selectedOption}</span>
                        <span class="status-meta">[${rowState.updatedBy} @ ${rowState.timestamp}]</span>
                    `;
                } else {
                    stageCell.textContent = "";
                    statusCell.innerHTML = "";
                }
            });
        });
    </script>
</body>
</html>
