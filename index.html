<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Status</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        .user-panel {
            margin-bottom: 20px;
            padding: 10px 15px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .user-panel input {
            padding: 6px 10px;
            font-size: 14px;
        }

        .btn-update {
            padding: 6px 14px;
            font-size: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-update:hover {
            background-color: #0056b3;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background-color: #fff;
        }

        th, td {
            border: 1px solid #000;
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #f2f2f2;
        }

        /* Interactive Status Box Cell */
        .status-cell {
            cursor: pointer;
            min-width: 220px;
            height: 30px;
            vertical-align: middle;
            transition: background-color 0.2s ease;
        }

        .status-cell:hover {
            background-color: #f0f0f0;
        }

        /* Selected Status Green Box */
        .status-cell.has-status {
            background-color: #4CAF50 !important;
            color: #ffffff;
            font-weight: bold;
            border-color: #388E3C;
        }

        .status-cell.has-status:hover {
            background-color: #45a049 !important;
        }

        .status-title {
            font-size: 14px;
            display: block;
        }

        .status-meta {
            font-size: 11px;
            font-weight: normal;
            display: block;
            margin-top: 2px;
            opacity: 0.9;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: center;
        }

        .modal h3 {
            margin-top: 0;
            font-size: 16px;
            color: #333;
        }

        .modal-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-btn {
            padding: 10px;
            font-size: 14px;
            background: #ffffff;
            border: 1px solid #aaa;
            border-radius: 4px;
            cursor: pointer;
        }

        .modal-btn:hover {
            background: #f0f0f0;
        }

        .modal-btn.clear-btn {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
            margin-top: 5px;
        }

        .modal-btn.clear-btn:hover {
            background-color: #f5c6cb;
        }

        .modal-btn.cancel-btn {
            background-color: #e2e3e5;
            color: #383d41;
            border-color: #d6d8db;
        }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <h2>Set Up Status</h2>

    <!-- User ID Input Panel -->
    <div class="user-panel">
        <label for="username"><strong>Staff Name:</strong></label>
        <input type="text" id="username" value="J" placeholder="Enter Staff Name">
        <button class="btn-update" id="btnUpdateName">Update</button>
    </div>

    <!-- Status Tracker Table -->
    <table id="trackerTable">
        <thead>
            <tr>
                <th>Venues</th>
                <th>Category</th>
                <th>Note</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dynamic Content -->
        </tbody>
    </table>

    <!-- Popup Modal -->
    <div class="modal-overlay" id="optionModal">
        <div class="modal">
            <h3 id="modalVenueTitle">Select Status</h3>
            <div class="modal-options">
                <button class="modal-btn" data-action="set" data-value="Eq at Venue">Eq at Venue</button>
                <button class="modal-btn" data-action="set" data-value="Eq set up">Eq set up</button>
                <button class="modal-btn" data-action="set" data-value="Eq Checked">Eq Checked</button>
                <button class="modal-btn" data-action="set" data-value="Eq Kept">Eq Kept</button>
                <button class="modal-btn clear-btn" data-action="clear">Clear Status / Reset</button>
                <button class="modal-btn cancel-btn" data-action="cancel">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // 1. REPLACE THIS WITH YOUR FIREBASE CONFIG
        // -------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyCvwQzmM5mYxj1NGEBcx4CwX2V94QfYBOw",
            authDomain: "set-up-status.firebaseapp.com",
            databaseURL: "https://set-up-status-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "set-up-status",
            storageBucket: "set-up-status.firebasestorage.app",
            messagingSenderId: "209978478786",
            appId: "1:209978478786:web:c202c1176964ab803d6b5b"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const statusRef = database.ref('setup_status');

        let currentStaffName = document.getElementById("username").value.trim() || "J";
        let activeVenueId = null;

        const tableData = [
            { id: "v1", venue: "Van Gogh #01-11", category: "Prep", note: "CL" },
            { id: "v2", venue: "2I #02-03", category: "Prep", note: "ML" },
            { id: "v3", venue: "6M #04-05", category: "Prep", note: "CL" },
            { id: "v4", venue: "2R #02-04", category: "Prep", note: "ML" },
            { id: "v5", venue: "1C #01-22", category: "Prep", note: "CL" },
            { id: "v6", venue: "5M #04-01", category: "Prep", note: "CL" },
            { id: "v7", venue: "2S #02-27", category: "Prep", note: "TL" },
            { id: "v8", venue: "Meeting Room 1", category: "Exam", note: "CL" },
            { id: "v9", venue: "Meeting Room 2", category: "Exam", note: "CL" },
            { id: "v10", venue: "Meeting Room 3", category: "Exam", note: "CL" },
            { id: "v11", venue: "6R classroom 01-29", category: "Exam", note: "CL" },
            { id: "v12", venue: "1R classroom 01-20", category: "Exam", note: "CL" },
            { id: "v13", venue: "1I classroom 01-21", category: "Exam", note: "CL" },
            { id: "v14", venue: "Einstein 02-15", category: "Exam", note: "ML" },
            { id: "v15", venue: "Newton 02-14", category: "Exam", note: "ML" },
            { id: "v16", venue: "4 M classroom 02-13", category: "Exam", note: "ML" },
            { id: "v17", venue: "Library Stage", category: "Exam", note: "ML" },
            { id: "v18", venue: "Library Corner A", category: "Exam", note: "ML" },
            { id: "v19", venue: "Library Corner B", category: "Exam", note: "ML" },
            { id: "v20", venue: "Library small room", category: "Exam", note: "ML" },
            { id: "v21", venue: "3T classroom 02-21", category: "Exam", note: "TL" },
            { id: "v22", venue: "6M2 classroom", category: "Exam", note: "CL" },
            { id: "v23", venue: "Music Room 1", category: "Exam", note: "CL" }
        ];

        const tbody = document.querySelector("#trackerTable tbody");
        const modal = document.getElementById("optionModal");
        const modalTitle = document.getElementById("modalVenueTitle");

        function getFormattedTime() {
            const now = new Date();
            return now.toTimeString().split(' ')[0]; // HH:MM:SS
        }

        // Render rows
        tableData.forEach((row) => {
            const tr = document.createElement("tr");
            tr.setAttribute("id", `row-${row.id}`);

            tr.innerHTML = `
                <td>${row.venue}</td>
                <td>${row.category}</td>
                <td>${row.note}</td>
                <td class="status-cell" id="status-${row.id}"></td>
            `;

            // Open Modal on cell click
            const statusCell = tr.querySelector(".status-cell");
            statusCell.addEventListener("click", () => {
                activeVenueId = row.id;
                modalTitle.textContent = `${row.venue}`;
                modal.classList.add("active");
            });

            tbody.appendChild(tr);
        });

        // Handle Modal Action Buttons
        modal.querySelectorAll(".modal-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const action = btn.getAttribute("data-action");

                if (action === "set") {
                    const opt = btn.getAttribute("data-value");
                    statusRef.child(activeVenueId).set({
                        selectedOption: opt,
                        updatedBy: currentStaffName,
                        timestamp: getFormattedTime()
                    });
                } else if (action === "clear") {
                    statusRef.child(activeVenueId).remove();
                }

                modal.classList.remove("active");
                activeVenueId = null;
            });
        });

        // Close Modal if user clicks outside box
        modal.addEventListener("click", (e) => {
            if (e.target === modal) {
                modal.classList.remove("active");
                activeVenueId = null;
            }
        });

        // -------------------------------------------------------------
        // Update Button: Updates local staff name & updates previous records
        // -------------------------------------------------------------
        document.getElementById("btnUpdateName").addEventListener("click", () => {
            const newName = document.getElementById("username").value.trim();
            if (!newName) {
                alert("Please enter a valid staff name.");
                return;
            }

            const oldName = currentStaffName;
            currentStaffName = newName;

            // Retroactively update entries updated by the old name
            if (oldName && oldName !== newName) {
                statusRef.once('value', (snapshot) => {
                    const updates = {};
                    const data = snapshot.val() || {};

                    Object.keys(data).forEach(vId => {
                        if (data[vId] && data[vId].updatedBy === oldName) {
                            updates[`${vId}/updatedBy`] = newName;
                        }
                    });

                    if (Object.keys(updates).length > 0) {
                        statusRef.update(updates);
                    }
                });
            }

            alert(`Staff name updated to: ${newName}`);
        });

        // -------------------------------------------------------------
        // Realtime Listener: Syncs Status UI live
        // -------------------------------------------------------------
        statusRef.on('value', (snapshot) => {
            const data = snapshot.val() || {};

            tableData.forEach((row) => {
                const cell = document.getElementById(`status-${row.id}`);
                const rowState = data[row.id];

                if (rowState && rowState.selectedOption) {
                    cell.classList.add("has-status");
                    cell.innerHTML = `
                        <span class="status-title">${rowState.selectedOption}</span>
                        <span class="status-meta">[${rowState.updatedBy} @ ${rowState.timestamp}]</span>
                    `;
                } else {
                    cell.classList.remove("has-status");
                    cell.innerHTML = "";
                }
            });
        });
    </script>
</body>
</html>
